l_english:

 # ── Displacement, rehousing pledge, and the poor who pay (2026-11-08) ────────
 # Must be saved as UTF-8 with BOM.
 boi_disp_culture_penalty_tt: "The largest group here that is not fully accepted loses #R 20#! acceptance for 10 years, and its people radicalize"
 boi_pledge_start_city_tt: "Starts a #b Rehousing Pledge#!: build #b [ROOT.GetCountry.MakeScope.ScriptValue('boi_pledge_target_city')|0]#! levels of good working-class housing in the works' states within two years (half a level for every level pulled down). If we fail, the poor there radicalize heavily."
 boi_pledge_start_rail_tt: "Starts a #b Rehousing Pledge#!: build #b [SCOPE.sState('survey_state').MakeScope.ScriptValue('boi_pledge_target_rail')|0]#! levels of good working-class housing in [SCOPE.sState('survey_state').GetName] within two years (one level for every 5 levels of city). If we fail, the poor there radicalize heavily."

 je_boi_rehousing_pledge: "Rehousing Pledge"
 je_boi_rehousing_pledge_activation_tt: "Promise new homes to the people turned out by a rail survey or a city modernisation"
 je_boi_rehousing_pledge_reason: "We promised new homes to the people turned out of their old ones: #b [JournalEntry.GetCountry.MakeScope.Var('boi_pledge_target').GetValue|0]#! levels of good working-class housing in the affected states, within two years.\n\nLevels of $building_boi_regulated_terraces$, $building_boi_model_dwellings$, $building_boi_apartments$, $building_boi_municipal_estates$, $building_boi_elevator_apartments$ and $building_boi_streetcar_suburbs$ built there since the promise count. Levels pulled down count against us."
 je_boi_rehousing_pledge_status: "Built #b [JournalEntry.GetCountry.MakeScope.Var('boi_pledge_built').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('boi_pledge_target').GetValue|0]#! levels of good housing"
 je_boi_rehousing_pledge_kept_desc: "The new homes stand, and the promise was kept."
 je_boi_rehousing_pledge_broken_desc: "Two years have passed, and the promised homes were never built."
 je_boi_rehousing_pledge_lost_desc: "The states we made the promise in are no longer ours."
 boi_pledge_kept_tt: "We have built the promised housing"
 boi_pledge_kept_effect_tt: "The poor in the affected states become #G loyalists#!, and the Trade Unions approve"
 boi_pledge_time_tt: "Two years have passed"
 boi_pledge_broken_effect_tt: "Heavy #R radicalization#! among the poor in the affected states. The largest group there that is not fully accepted loses #R 20#! acceptance for 10 years. The Trade Unions are angered, and legitimacy falls for five years."
 boi_pledge_lost_tt: "We no longer own any of the affected states"
 boi_pledge_bar: "Homes built"
 boi_pledge_bar_desc: "Built: #v [JournalEntry.GetCountry.MakeScope.Var('boi_pledge_built').GetValue|0] / [JournalEntry.GetCountry.MakeScope.Var('boi_pledge_target').GetValue|0]#! levels"

 boi_pledge_broken: "A Broken Promise"
 boi_pledge_broken_desc: "We promised the evicted new homes and never built them."
 boi_disp_navvy_fever: "Fever in the Navvy Camps"
 boi_disp_navvy_fever_desc: "The contractors' camps are spreading disease."
 boi_disp_cottagers: "Cottagers Turned Off"
 boi_disp_cottagers_desc: "Families turned off the land for the railway are leaving."
 boi_disp_overcrowding: "Overcrowded Districts"
 boi_disp_overcrowding_desc: "The displaced have crowded into what is left of the old city."
 boi_disp_rent_control: "Rent Controls"
 boi_disp_rent_control_desc: "Rents are capped, and builders are wary."
 boi_disp_cholera: "Cholera in the Courts"
 boi_disp_cholera_desc: "Cholera is spreading through the crowded courts."

 # ── Rail Network Survey ───────────────────────────────────────────────────────
 boi_rail_survey.15.t: "Fever in the Navvy Camps"
 boi_rail_survey.15.d: "The survey parties in [SCOPE.sState('survey_state').GetName] are followed by gangs of labourers who sleep in huts and tents along the route. There are no drains and no doctor, and the fever has started."
 boi_rail_survey.15.f: "The navvy built the line, and the line buried the navvy."
 boi_rail_survey.15.a: "Pay for drains, huts and a doctor"
 boi_rail_survey.15.b: "The contractors' men are the contractors' business"
 boi_rail_survey.25.t: "Families on the Route"
 boi_rail_survey.25.d: "The line into [SCOPE.sState('survey_state').GetName] runs through streets where thousands of working families live. The surveyors ask what is to become of them when the houses come down."
 boi_rail_survey.25.f: "\"Where are we to go?\" was written on a wall the night before the clearance."
 boi_rail_survey.25.a: "Promise them new homes within two years"
 boi_rail_survey.25.b: "Force them out now"
 boi_rail_survey.26.t: "Cottagers Turned Off the Land"
 boi_rail_survey.26.d: "Tenant cottagers in [SCOPE.sState('survey_state').GetName] have been given notice: their cottages stand where the line will run. They have nowhere else to go."
 boi_rail_survey.26.f: "The landlord sold the field, and the cottage with it."
 boi_rail_survey.26.a: "Resettle them, whatever it costs"
 boi_rail_survey.26.b: "Let them go where they will"

 # ── City Modernisation ────────────────────────────────────────────────────────
 boi_city_modernisation.12.t: "Where Are They to Go?"
 boi_city_modernisation.12.d: "The first districts of [SCOPE.sState('cm_state').GetName] are rubble, and the families who lived there are camped in the streets and doorways. The reformers say we owe them homes. The prefect says the city owes them nothing."
 boi_city_modernisation.12.f: "\"They have their freedom: the freedom to go elsewhere.\""
 boi_city_modernisation.12.a: "Promise them new homes within two years"
 boi_city_modernisation.12.b: "They will find somewhere. Force them out now"
 boi_city_modernisation.22.t: "Rents Soar in What Is Left"
 boi_city_modernisation.22.d: "Half of [SCOPE.sState('cm_state').GetName]'s old districts are gone, and their people have crowded into the rest. Three families share a room, and the rents have doubled."
 boi_city_modernisation.22.f: "The boulevards went up, and so did the rents."
 boi_city_modernisation.22.a: "Cap the rents"
 boi_city_modernisation.22.b: "The market will build what is wanted"
 boi_city_modernisation.32.t: "Cholera in the Crowded Courts"
 boi_city_modernisation.32.d: "Cholera has broken out in the overcrowded courts of [SCOPE.sState('cm_state').GetName], where the displaced have packed in. The wells are foul, and the new sewers do not reach them."
 boi_city_modernisation.32.f: "The cholera kept to the poor quarters, as it always did."
 boi_city_modernisation.32.a: "Emergency sanitation works"
 boi_city_modernisation.32.b: "Close the courts and wait for it to pass"
 boi_city_modernisation.33.t: "Barricades in the Faubourgs"
 boi_city_modernisation.33.d: "The people turned out of the old districts of [SCOPE.sState('cm_state').GetName] have torn up the paving stones. Barricades stand across the streets the works have not reached yet."
 boi_city_modernisation.33.f: "Straight, wide streets are hard to barricade. That was the point."
 boi_city_modernisation.33.a: "Send in the troops"
 boi_city_modernisation.33.b: "Negotiate with the faubourgs"
