 boi_rs_quality_forced_large_tt: "Survey quality #G +[ROOT.GetCountry.MakeScope.ScriptValue('boi_rs_forced_quality_large')|1]#!, more with stronger policing"
 boi_rs_progress_up_5_tt: "Survey progress #G +5%#!"
 boi_rs_progress_up_10_tt: "Survey progress #G +10%#!"
 boi_rs_progress_down_5_tt: "Survey progress #R -5%#!"
 boi_rs_progress_down_10_tt: "Survey progress #R -10%#!"

 # ── First stage: routes ─────────────────────────────────────────
 boi_rail_survey.11.t: "A Disputed Valley"
 boi_rail_survey.11.d: "Two survey parties in [SCOPE.sState('survey_state').GetName] disagree. One wants the long way round the hills, on an easy gradient that any locomotive can manage. The other wants to go straight over, which is shorter and cheaper but steep enough to slow every train for decades."
 boi_rail_survey.11.f: "\"Gradients are forever. Money is spent once.\""
 boi_rail_survey.11.a: "Take the long way round"
 boi_rail_survey.11.b: "Go over the top"
 boi_rail_survey.12.t: "Surveyors Lost in the Hills"
 boi_rail_survey.12.d: "A survey party in [SCOPE.sState('survey_state').GetName] has not been heard from in three weeks. Its instruments, its notes and its men are somewhere in country our maps barely show."
 boi_rail_survey.12.f: "The last letter spoke of fog and a broken theodolite."
 boi_rail_survey.12.a: "Send a relief party"
 boi_rail_survey.12.b: "Press on without them"
 boi_rail_survey.13.t: "A Gentleman Engineer Volunteers"
 boi_rail_survey.13.d: "A retired engineer with a lifetime of railway work behind him has offered his services to the survey in [SCOPE.sState('survey_state').GetName] for no fee at all. He seems to know every valley in the state."
 boi_rail_survey.13.f: "\"I laid my first line before most of your surveyors were born.\""
 boi_rail_survey.13.a: "Take his advice"
 boi_rail_survey.13.b: "Put him in charge"
 boi_rail_survey.14.t: "The Maps Are Wrong"
 boi_rail_survey.14.d: "The old county maps of [SCOPE.sState('survey_state').GetName] have turned out to be badly wrong: rivers out of place, hills that aren't there and others that are. A month of work rests on them."
 boi_rail_survey.14.f: "One surveyor found a village marked two miles from where it stands."
 boi_rail_survey.14.a: "Survey it again from scratch"
 boi_rail_survey.14.b: "Live with the errors"

 # ── Second stage: land ──────────────────────────────────────────
 boi_rail_survey.21.t: "Freeholders Refuse to Sell"
 boi_rail_survey.21.d: "Small farmers along the chosen route in [SCOPE.sState('survey_state').GetName] will not sell. Their families have worked the land for generations, and no price we have offered has moved them."
 boi_rail_survey.21.f: "\"You may survey my field, sir, but you will not have it.\""
 boi_rail_survey.21.a: "Force them out"
 boi_rail_survey.21.b: "Pay well over the odds"
 boi_rail_survey.21.c: "Route around them"
 boi_rail_survey.22.t: "A Village in the Way"
 boi_rail_survey.22.d: "The best route through [SCOPE.sState('survey_state').GetName] runs straight through a village. The engineers say that any other line will add miles of track and a dozen bridges."
 boi_rail_survey.22.f: "The church has stood there for four hundred years."
 boi_rail_survey.22.a: "Clear the village"
 boi_rail_survey.22.b: "Bend the line around it"
 boi_rail_survey.23.t: "Landowners Demand Compensation"
 boi_rail_survey.23.d: "The great estates of [SCOPE.sState('survey_state').GetName] say the survey parties have trampled their crops and frightened their game. They want compensation, and they want it before the survey goes any further."
 boi_rail_survey.23.f: "The letters arrive on crested paper, in triplicate."
 boi_rail_survey.23.a: "Pay them"
 boi_rail_survey.23.b: "Refuse"
 boi_rail_survey.23.c: "Compel sale at the assessed value"
 boi_rail_survey.24.t: "Speculators on the Route"
 boi_rail_survey.24.d: "Someone has leaked the survey's routes through [SCOPE.sState('survey_state').GetName]. Speculators have bought up the land along them and now ask ten times what it was worth a month ago."
 boi_rail_survey.24.f: "The newspapers have already printed the names of three ministers' cousins."
 boi_rail_survey.24.a: "Buy them out and get on with it"
 boi_rail_survey.24.b: "Expose them and redraw the routes"

 # ── Third stage: approval ───────────────────────────────────────
 boi_rail_survey.31.t: "Parliament Questions the Cost"
 boi_rail_survey.31.d: "The survey's bills have reached the floor of the legislature. Members want to know why charting a few lines through [SCOPE.sState('survey_state').GetName] costs so much, and whether it needs doing at all."
 boi_rail_survey.31.f: "\"The honourable member may ride his horse to the capital, if he prefers.\""
 boi_rail_survey.31.a: "Defend the budget"
 boi_rail_survey.31.b: "Trim the survey to finish sooner"
 boi_rail_survey.32.t: "Unrest in the Navvies' Camp"
 boi_rail_survey.32.d: "The labourers clearing the survey lines in [SCOPE.sState('survey_state').GetName] have downed tools. They want better pay, and the work has stopped until they get it."
 boi_rail_survey.32.f: "The camp foreman's hut has been barricaded since Tuesday."
 boi_rail_survey.32.a: "Break the strike"
 boi_rail_survey.32.b: "Raise their pay"
 boi_rail_survey.33.t: "Investors Offer Backing"
 boi_rail_survey.33.d: "A group of financiers, impressed by the routes charted through [SCOPE.sState('survey_state').GetName], has offered to pay part of the survey's costs, in return for a first look at its findings."
 boi_rail_survey.33.f: "\"Consider it an investment in our mutual prosperity.\""
 boi_rail_survey.33.a: "Accept their money"
 boi_rail_survey.33.b: "Keep the survey a public one"
 boi_rail_survey.34.t: "Rookeries on the Route"
 boi_rail_survey.34.d: "The only way into the heart of [SCOPE.sState('survey_state').GetName]'s largest city runs through its crowded back streets. Thousands live in the courts and tenements that the line would cross."
 boi_rail_survey.34.f: "The vestry says the district has not been mapped since the last cholera year."
 boi_rail_survey.34.a: "Clear the streets"
 boi_rail_survey.34.b: "Tunnel beneath them"

 # ── Militarized Police ──────────────────────────────────────────
 boi_rail_survey.40.t: "Heavy-Handed Clearances"
 boi_rail_survey.40.d: "The police detachments escorting the survey parties in [SCOPE.sState('survey_state').GetName] have been clearing the route with rifles and bayonets. The routes are clear, but word of it is spreading through every surveyed state."
 boi_rail_survey.40.f: "\"We were told to clear the line. We cleared it.\""
 boi_rail_survey.40.a: "Stand by the police"
 boi_rail_survey.40.b: "Rein them in"

 # ── Completion ──────────────────────────────────────────────────
 boi_rail_survey.90.t: "The Survey Is Complete"
 boi_rail_survey.90.d: "After [ROOT.GetCountry.MakeScope.Var('boi_rs_last_months').GetValue|0] months in the field, the Rail Network Survey has finished its work in [ROOT.GetCountry.MakeScope.Var('boi_rs_last_states').GetValue|0] states, with a final quality of [ROOT.GetCountry.MakeScope.Var('boi_rs_last_quality').GetValue|0]. Each of them can now hold [ROOT.GetCountry.MakeScope.Var('boi_rs_last_levels').GetValue|0] more levels of $building_boi_rail_works$."
 boi_rail_survey.90.f: "The maps go to the printers, and the engineers to the next commission."
 boi_rail_survey.90.a: "Lay the track"
 boi_rs_award_tt: "Every surveyed state can hold more levels of $building_boi_rail_works$"
