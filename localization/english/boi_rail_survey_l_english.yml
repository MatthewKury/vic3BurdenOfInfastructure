 # ── Journal entry ───────────────────────────────────────────────
 je_boi_rail_survey: "Rail Network Survey"
 je_boi_rail_survey_activation_tt: "Take the decision #b $boi_commission_rail_survey$#! and choose a region"
 je_boi_rail_survey_reason: "Survey parties are charting railway routes through [JournalEntry.GetCountry.MakeScope.Var('boi_rs_states').GetValue|0] of our states. We pay for them every week until the work is done, and the choices we make along the way decide how good the result is. When it is finished, every surveyed state gains 1 to 5 more levels of $building_boi_rail_works$, depending on the survey's quality."
 je_boi_rail_survey_completed_desc: "The survey is complete, and its routes are open to new lines."
 je_boi_rail_survey_cancelled_desc: "The survey was abandoned before it was finished."
 je_boi_rail_survey_lost_desc: "Every state under survey passed out of our hands, and the survey parties went home."
 boi_rs_progress_bar: "Survey progress"
 boi_rs_progress_bar_desc: "How much of the survey is done. Progress is the same each month, faster with surplus bureaucracy, and some choices set it forward or back. Events come at 25%, 50% and 75%."
 boi_rs_quality_bar: "Survey quality"
 boi_rs_quality_bar_desc: "How good the routes are. At the end, each surveyed state gains 1 level of $building_boi_rail_works$ below 20, 2 from 20, 3 from 40, 4 from 60 and 5 from 80."
 boi_rs_complete_tt: "The survey reaches 100%"
 boi_rs_complete_effect_tt: "Every surveyed state we still own gains 1 to 5 more levels of $building_boi_rail_works$, by the survey's quality"
 boi_rs_cancelled_header: "Abandon the survey"
 boi_rs_cancelled_tt: "We abandon the survey"
 boi_rs_cancelled_effect_tt: "The survey ends with no result. The money already spent is lost"
 boi_rs_lost_tt: "We no longer own any of the surveyed states"
 boi_rs_lost_effect_tt: "The survey ends with no result"
 boi_rs_cancel_button: "Abandon the Survey"
 boi_rs_cancel_button_desc: "Call the survey parties home. No state gains anything, and the money already spent is lost."
 boi_rs_cancel_button_tt: "The survey ends next month with no result"

