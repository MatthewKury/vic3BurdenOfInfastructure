 state_building_boi_rail_works_max_level_add_desc: "A bonus or penalty to the maximum level of $building_boi_rail_works$ buildings."
 boi_rail_cap_normal: "Rail Corridors"
 boi_rail_cap_normal_desc: "The ground has room for only a few lines until it is properly surveyed."
 boi_rail_cap_large: "Wide Rail Corridors"
 boi_rail_cap_large_desc: "A large state, with room for more lines before a survey is needed."
 boi_rail_cap_very_large: "Open Rail Corridors"
 boi_rail_cap_very_large_desc: "A vast state, with room for many lines before a survey is needed."
 boi_rail_cap_survey: "Surveyed Rail Network"
 boi_rail_cap_survey_desc: "A Rail Network Survey has charted routes for more lines through this state."
 boi_rail_survey_expenses: "Rail Network Survey"
 boi_rail_survey_expenses_desc: "Surveyors, engineers and land agents in the field."
 boi_rail_survey_underway: "Rail Network Survey Underway"
 boi_rail_survey_underway_desc: "Survey parties are charting railway routes through this state."
 boi_rs_ig_angered: "Angered by the Rail Survey"
 boi_rs_ig_angered_desc: "The way the Rail Network Survey was carried out has turned this group against the government."
 boi_rs_ig_pleased: "Pleased by the Rail Survey"
 boi_rs_ig_pleased_desc: "The way the Rail Network Survey was carried out has won this group's favour."

 # ── Decision ────────────────────────────────────────────────────
 boi_commission_rail_survey: "Commission a Rail Network Survey"
 boi_commission_rail_survey_desc: "Each state has room for only a few #b $building_boi_rail_works$#! levels until its routes are surveyed. Choose a strategic region: every state we own there will be surveyed. While the survey runs we pay its expenses, and its choices decide how good the result is. At the end, every surveyed state gains 1 to 5 more levels of $building_boi_rail_works$."
 boi_rs_needs_eligible_state_tt: "We own at least one state that is not already being surveyed"

