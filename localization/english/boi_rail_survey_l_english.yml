 boi_rail_survey.1.t: "A Rail Network Survey"
 boi_rail_survey.1.d: "The engineers are ready to take to the field. Where should they begin?"
 boi_rail_survey.1.f: "Every mile of track begins as a line on a surveyor's map."
 boi_rail_survey.1.europe: "Europe"
 boi_rail_survey.1.africa: "Africa"
 boi_rail_survey.1.east_asia: "East Asia and Oceania"
 boi_rail_survey.1.south_asia: "The Near East, Central and South Asia"
 boi_rail_survey.1.north_america: "North and Central America"
 boi_rail_survey.1.south_america: "South America"
 boi_rail_survey.1.cancel: "Not now"
 boi_rs_picker_cancel_tt: "No survey is started"
 boi_rail_survey.2.t: "Survey Europe"
 boi_rail_survey.3.t: "Survey Africa"
 boi_rail_survey.4.t: "Survey East Asia and Oceania"
 boi_rail_survey.5.t: "Survey the Near East, Central and South Asia"
 boi_rail_survey.6.t: "Survey North and Central America"
 boi_rail_survey.7.t: "Survey South America"
 boi_rail_survey.region.d: "Every state we own in the chosen region will be surveyed. More states make a longer survey, and so do big cities, whose streets and property make every mile of route harder to secure."
 boi_rail_survey.region.back: "Choose another continent"
 boi_rs_choose_region_tt: "Every state we own in this region that is not already under survey is surveyed. The survey's length depends on how many states there are and how urbanized they are."
