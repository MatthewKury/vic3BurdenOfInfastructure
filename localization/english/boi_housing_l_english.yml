 decree_boi_emergency_accommodation: "Emergency Accommodation"
 decree_boi_emergency_accommodation_desc: "Permit crowding across basic accommodation providers, increasing Housing output at the cost of higher mortality. Does not create buildings or luxury accommodation."
 ideology_boi_housing_reform: "Housing Reform"
 ideology_boi_housing_reform_desc: "Supports minimum residential standards and protection from Work Camps."
 ideology_boi_housing_laissez_faire: "Unregulated Housing"
