 pm_boi_slums: "Slum Districts"
 building_boi_tenements: "Tenement Districts"
 building_boi_tenements_desc: "Maintained accommodation with substantial infrastructure demand. Denser apartments supply more housing per infrastructure. Redevelopment requires replacement construction."
