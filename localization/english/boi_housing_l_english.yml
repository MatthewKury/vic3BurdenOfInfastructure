 law_boi_protected_company_housing_desc: "Employers may run Work Towns or provide no housing. Existing company housing converts to Work Towns."
 law_boi_mandated_serviced_housing_desc: "Employers may run Serviced Towns or provide no housing. Existing company housing converts to Serviced Towns, or closes without Modern Sewerage."
 law_boi_unregulated_residential_desc: "Slum districts, workers' rows and tenement blocks may be constructed."
