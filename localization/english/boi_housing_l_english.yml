 law_boi_unregulated_company_housing: "Unregulated Employer Housing"
 law_boi_protected_company_housing: "Protected Employer Housing"
 law_boi_mandated_serviced_housing: "Mandatory Serviced Housing"
 law_boi_unregulated_residential: "Unregulated Residential Development"
 law_boi_residential_standards: "Minimum Residential Standards"
 law_boi_unregulated_company_housing_desc: "Employers may run Work Camps or provide no housing. Existing company housing converts to Work Camps."
 law_boi_protected_company_housing_desc: "Employers may run Work Towns or provide no housing. Existing company housing converts to Work Towns."
 law_boi_mandated_serviced_housing_desc: "Employers may run Serviced Towns or provide no housing. Existing company housing converts to Serviced Towns, or closes without Modern Sewerage."
 law_boi_unregulated_residential_desc: "Slum districts, workers' rows and tenement blocks may be constructed."
 law_boi_residential_standards_desc: "New slum districts, workers' rows and tenement blocks are prohibited, including expansions. Existing buildings remain until acquired and demolished."
 decree_boi_emergency_accommodation: "Emergency Accommodation"
 decree_boi_emergency_accommodation_desc: "Permit crowding across basic accommodation providers, increasing Housing output at the cost of higher mortality. Does not create buildings or luxury accommodation."
 ideology_boi_housing_reform: "Housing Reform"
 ideology_boi_housing_reform_desc: "Supports minimum residential standards and protection from Work Camps."
 ideology_boi_housing_laissez_faire: "Unregulated Housing"
 ideology_boi_housing_laissez_faire_desc: "Opposes restrictions on residential development and employer accommodation."
 ideology_boi_housing_moral_reform: "Moral Housing Reform"
 ideology_boi_housing_moral_reform_desc: "Sees overcrowding as a moral danger. Supports minimum residential standards and protection from Work Camps, but trusts charity and good employers over a state mandate."
 ideology_boi_housing_recruit_fitness: "Fit Recruits"
 ideology_boi_housing_recruit_fitness_desc: "Blames bad housing for sickly recruits. Supports minimum residential standards and protected employer housing."
 ideology_boi_housing_tied_cottages: "Tied Cottages"
 ideology_boi_housing_tied_cottages_desc: "Resents Work Camps and tied cottages, and opposes building by-laws that outlaw the cheap cottage."
 ideology_boi_housing_ratepayers: "Ratepayers' Interest"
 ideology_boi_housing_ratepayers_desc: "Small landlords, builders and shopkeepers oppose by-laws, the rates that fund them, and the company store."
 goods_output_boi_housing_add: "@boi_housing! Housing output"
 goods_output_boi_housing_add_desc: "The amount of basic accommodation supplied by buildings."
 goods_output_boi_housing_mult: "Building @boi_housing! Housing output"
 goods_output_boi_housing_mult_desc: "An increase or decrease in basic accommodation supplied by buildings."
 goods_output_boi_luxury_housing_add: "@boi_luxury_housing! Luxury Housing output"
