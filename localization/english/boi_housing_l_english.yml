 goods_output_boi_luxury_housing_mult: "Building @boi_luxury_housing! Luxury Housing output"
 goods_output_boi_luxury_housing_mult_desc: "An increase or decrease in luxury accommodation supplied by buildings."
 goods_input_boi_housing_add: "@boi_housing! Housing input"
 goods_input_boi_housing_add_desc: "Basic accommodation purchased by buildings."
 goods_input_boi_housing_mult: "Building @boi_housing! Housing input"
 goods_input_boi_housing_mult_desc: "An increase or decrease in basic accommodation purchased by buildings."
 goods_input_boi_luxury_housing_add: "@boi_luxury_housing! Luxury Housing input"
 goods_input_boi_luxury_housing_add_desc: "Luxury accommodation purchased by buildings."
 goods_input_boi_luxury_housing_mult: "Building @boi_luxury_housing! Luxury Housing input"
 goods_input_boi_luxury_housing_mult_desc: "An increase or decrease in luxury accommodation purchased by buildings."
 goods_input_furniture_add: "@furniture! Furniture input"
 goods_input_furniture_add_desc: "Furniture used to maintain furnished residential accommodation."
