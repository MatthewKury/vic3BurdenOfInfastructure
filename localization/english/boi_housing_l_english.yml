 decree_boi_emergency_accommodation: "Emergency Accommodation"
 decree_boi_emergency_accommodation_desc: "Permit crowding across basic accommodation providers, increasing Housing output at a temporary living-standard cost. Does not create buildings or luxury accommodation."
 ideology_boi_housing_reform: "Housing Reform"
