l_english:
 # "Ahead of the Traffic" (D1, 2026-11-09): events/boi_infrastructure_surplus_events.txt
 boi_surplus.10.t: "Ahead of the Traffic"
 boi_surplus.10.d_road: "The new roads of [SCOPE.sState('surplus_state').GetName] stand half-empty. The Road Works have built ahead of the traffic, and the mill-owners, the shopkeepers and the ministry each have a use in mind for the spare capacity."
 boi_surplus.10.d_rail: "The goods sheds of [SCOPE.sState('surplus_state').GetName] stand half-empty. The Rail Works have built ahead of the traffic, and the mill-owners, the shopkeepers and the ministry each have a use in mind for the spare capacity."
 boi_surplus.10.d_harbour: "The new quays of [SCOPE.sState('surplus_state').GetName] stand half-idle. The Harbour Works have built ahead of the traffic, and the mill-owners, the shopkeepers and the ministry each have a use in mind for the spare capacity."
 boi_surplus.10.f: "A road is built for the traffic it will carry, not the traffic it finds."
 boi_surplus.10.a: "Open the roads to the mills"
 boi_surplus.10.b: "Grant a market-town charter"
 boi_surplus.10.c: "Proclaim the government's works"
 boi_surplus.11.t: "Ahead of the Traffic"
 boi_surplus.11.d_road: "The new roads of [SCOPE.sState('surplus_state').GetName] stand half-empty. The Road Works have built ahead of the traffic, and the mine-owners, the great estates and the villages each want the spare capacity for themselves."
 boi_surplus.11.d_rail: "The goods sheds of [SCOPE.sState('surplus_state').GetName] stand half-empty. The Rail Works have built ahead of the traffic, and the mine-owners, the great estates and the villages each want the spare capacity for themselves."
 boi_surplus.11.d_harbour: "The new quays of [SCOPE.sState('surplus_state').GetName] stand half-idle. The Harbour Works have built ahead of the traffic, and the mine-owners, the great estates and the villages each want the spare capacity for themselves."
 boi_surplus.11.f: "The same road carries the estate's harvest or the village's. Rarely both."
 boi_surplus.11.a: "Open up the hinterland"
 boi_surplus.11.b: "Carry the harvest to market"
 boi_surplus.11.c: "Market roads for the villages"
 boi_surplus_mills: "Roads to the Mills"
 boi_surplus_mills_desc: "The spare capacity of the state's works serves its industry first."
 boi_surplus_charter: "Market-Town Charter"
 boi_surplus_charter_desc: "A chartered market draws traders, settlers and builders along the new roads."
 boi_surplus_government_works: "The Government's Works"
 boi_surplus_government_works_desc: "The government claims the new roads and quays as its own achievement. The more it controls the press, the louder the claim."
 boi_surplus_hinterland: "The Hinterland Opened"
 boi_surplus_hinterland_desc: "New roads reach the mines and the timber stands."
 boi_surplus_harvest: "The Harvest to Market"
 boi_surplus_harvest_desc: "The estates' harvest reaches market on the spare roads."
 boi_surplus_villages: "Village Market Roads"
 boi_surplus_villages_desc: "Grain and doctors reach the villages in a bad year."
 boi_surplus_ig_pleased: "Spare Capacity Granted"
 boi_surplus_ig_pleased_desc: "This group was given the spare capacity of the works."
