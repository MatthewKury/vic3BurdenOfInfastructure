l_english:

 # ── City Modernisation (2026-11-08) ──────────────────────────────────────────
 # Design: docs/plans/06_FEATURE_COMPLETE_PLAN.md, A4. Must be saved as UTF-8 with BOM.
 boi_city_modernisation: "Modernise a City"
 boi_city_modernisation_desc: "Our standards ban the slums, but the old districts still stand. Choose a strategic region: in every state we own there, the #b $building_boi_slums$#! and #b $building_boi_tenements$#! will be pulled down, whoever owns them, a quarter of the states at a time. They can never be built there again. From the first clearance until five years after the works finish, construction there is 20% faster."
 boi_cm_debt_tt: "Our debt is under half of what we can borrow"
 boi_cm_needs_eligible_state_tt: "We own a state with #b $building_boi_slums$#! or #b $building_boi_tenements$#!"
 boi_cm_choose_region_tt: "Every state we own in this region with #b $building_boi_slums$#! or #b $building_boi_tenements$#! is modernised. Each extra state adds three months, up to five years."
 boi_cm_picker_cancel_tt: "No modernisation is started"
 boi_city_modernisation.1.t: "Modernising a City"
 boi_city_modernisation.1.d: "The prefect has the plans: broad avenues, sewers and new housing where the rookeries stand. Where should the works begin?"
 boi_city_modernisation.1.f: "A city is not built, it is rebuilt."
 boi_city_modernisation.2.t: "Modernise in Europe"
 boi_city_modernisation.3.t: "Modernise in Africa"
 boi_city_modernisation.4.t: "Modernise in East Asia and Oceania"
 boi_city_modernisation.5.t: "Modernise in the Near East, Central and South Asia"
 boi_city_modernisation.6.t: "Modernise in North and Central America"
 boi_city_modernisation.7.t: "Modernise in South America"
 boi_city_modernisation.region.d: "Every state we own in the chosen region that still has slums or workers' rows will be cleared. More states make longer works."

 je_boi_city_modernisation: "City Modernisation"
 je_boi_city_modernisation_activation_tt: "Take the decision #b $boi_city_modernisation$#! and choose a region"
 je_boi_city_modernisation_reason: "We are clearing the old districts of [JournalEntry.GetCountry.MakeScope.Var('boi_cm_states').GetValue|0] states: [JournalEntry.GetCountry.MakeScope.Var('boi_cm_levels_cleared').GetValue|0] levels of slums and rows are down so far. We pay for the works every week until they are finished.\n\n#b Progress#! is the same each month, faster with surplus bureaucracy. A quarter of the states is cleared at 25%, 50% and 75%, each with an event, and the last states at 100%."
 je_boi_city_modernisation_completed_desc: "The works are finished, and the new city is ours."
 je_boi_city_modernisation_stopped_desc: "The works were stopped before they were finished. The districts already cleared stay cleared."
 je_boi_city_modernisation_lost_desc: "Every state under modernisation passed out of our hands."
 boi_cm_complete_tt: "The works are complete"
 boi_cm_complete_effect_tt: "The last states are cleared. For five years every state of the works builds 20% faster and draws more migrants, and we gain prestige. The decision can't be taken again for five years."
 boi_cm_stopped_header: "Stopped"
 boi_cm_stopped_tt: "The works are abandoned, or #b $law_boi_residential_standards$#! was repealed"
 boi_cm_stopped_effect_tt: "Cleared states stay cleared, but the construction bonus ends"
 boi_cm_lost_tt: "We no longer own any state of the works"
 boi_cm_lost_effect_tt: "The works end"
 boi_cm_progress_bar: "Works progress"
 boi_cm_progress_bar_desc: "Progress: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!"
 boi_cm_cancel_button: "Abandon the Works"
 boi_cm_cancel_button_desc: "Stop the modernisation. The districts already cleared stay cleared, but the construction bonus ends and the money spent is lost."
 boi_cm_cancel_button_tt: "The works end next month"
 boi_cm_progress_up_15_tt: "Works progress #G +15%#!"
 boi_cm_boulevards_tt: "On completion, #G +20#! prestige for five years"
 boi_cm_workers_tt: "On completion, the works' states build a further #G 10%#! faster for five years"

 boi_city_modernisation_expenses: "City Modernisation"
 boi_city_modernisation_expenses_desc: "Compensation, demolition and new streets."
 boi_cm_underway: "Modernisation Underway"
 boi_cm_underway_desc: "This state's old districts are being cleared."
 boi_cm_modernised_city: "Modernised City"
 boi_cm_modernised_city_desc: "New streets and cleared ground: building goes faster, and people come to live here."
 boi_cm_workers_housing: "Workers' Housing Programme"
 boi_cm_workers_housing_desc: "The cleared ground is set aside for workers' housing."
 boi_cm_new_capital: "A Modern City"
 boi_cm_new_capital_desc: "The world admires our rebuilt city."
 boi_cm_boulevards: "Grand Boulevards"
 boi_cm_boulevards_desc: "Avenues, squares and an opera house that visitors come to see."
 boi_cm_ig_pleased: "Pleased by the City Works"
 boi_cm_ig_angered: "Angered by the City Works"

 boi_city_modernisation.11.t: "The Old Districts Come Down"
 boi_city_modernisation.11.d: "The first districts of [SCOPE.sState('cm_state').GetName] have been pulled down: courts, rookeries and rows that stood for a century. Their owners want to be paid, and the people who lived there want to know where they are to go."
 boi_city_modernisation.11.f: "\"They have taken the street, and the house, and the parish with it.\""
 boi_city_modernisation.11.a: "Pay the owners a fair price"
 boi_city_modernisation.11.b: "The law allows it. Expropriate"
 boi_city_modernisation.21.t: "What Will Stand in Their Place?"
 boi_city_modernisation.21.d: "Half the works are done, and the cleared ground in [SCOPE.sState('cm_state').GetName] lies open. The architects want boulevards and an opera house. The reformers want homes for the people who were turned out."
 boi_city_modernisation.21.f: "Every city is a choice about who lives in it."
 boi_city_modernisation.21.a: "Boulevards fit for a capital"
 boi_city_modernisation.21.b: "Workers' housing on the cleared ground"
 boi_city_modernisation.31.t: "The Bills for the Works"
 boi_city_modernisation.31.d: "The works have cost more than the estimates, as works do. The bankers will lend against the value of the new streets, and the prefect wants to finish sooner."
 boi_city_modernisation.31.f: "\"Fantastic accounts,\" said the critics. The avenues were built all the same."
 boi_city_modernisation.31.a: "We pay as we go"
 boi_city_modernisation.31.b: "Borrow, and finish sooner"
 boi_city_modernisation.90.t: "A Modern City"
 boi_city_modernisation.90.d: "The works are finished. [ROOT.GetCountry.MakeScope.Var('boi_cm_last_levels').GetValue|0] levels of slums and rows across [ROOT.GetCountry.MakeScope.Var('boi_cm_last_states').GetValue|0] states have been cleared in [ROOT.GetCountry.MakeScope.Var('boi_cm_last_months').GetValue|0] months, and they will never return."
 boi_city_modernisation.90.f: "Light, air and straight streets, for those who can afford them."
 boi_city_modernisation.90.a: "Let them see what we have built"
