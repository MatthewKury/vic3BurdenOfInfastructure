l_english:

 # ── Goods ─────────────────────────────────────────────────────────────────────
 # NOTE: this file MUST be saved as UTF-8 WITH BOM. Victoria 3 rejects plain
 # UTF-8 .yml outright - the whole file fails to load and every key in it is
 # reported as missing, which looks like dozens of unrelated errors.
 horses:0 "Horses"

 # ── Horse modifier labels ────────────────────────────────────────────────────
 goods_input_horses_add:0 "@horses! Horses input"
