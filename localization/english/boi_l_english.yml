l_english:

 # ── Goods ─────────────────────────────────────────────────────────────────────
 # NOTE: this file MUST be saved as UTF-8 WITH BOM. Victoria 3 rejects plain
 # UTF-8 .yml outright - the whole file fails to load and every key in it is
 # reported as missing, which looks like dozens of unrelated errors.
 horses:0 "Horses"

 # ── Buildings ─────────────────────────────────────────────────────────────────
 # Vanilla buildings and goods have no _desc loc keys - the UI builds their
 # descriptions out of the active production methods - so none are defined here.
 # The _lens_option key is the "Expand X" label in the construction lens.

 building_boi_horse_ranch:0 "Horse Ranches"
 building_boi_horse_ranch_lens_option:0 "Expand $building_boi_horse_ranch$"

 building_boi_infrastructure:0 "Public Works"
 building_boi_infrastructure_lens_option:0 "Expand $building_boi_infrastructure$"

 building_boi_harbour_works:0 "Harbour Works"
 building_boi_harbour_works_lens_option:0 "Expand $building_boi_harbour_works$"

 # ── Production Method Groups ──────────────────────────────────────────────────
 pmg_boi_horse_ranch_method:0 "Breeding Method"
 pmg_boi_infrastructure_method:0 "Haulage Method"
 pmg_boi_road_administration:0 "Road Administration"
 pmg_boi_harbour_method:0 "Harbour Method"
 pmg_boi_harbour_administration:0 "Harbour Administration"

 # ── Horse Ranch Production Methods ────────────────────────────────────────────
 pm_boi_open_pasture:0 "Open Pasture"
 pm_boi_selective_breeding:0 "Selective Breeding"
 pm_boi_stud_farms:0 "Stud Farms"

