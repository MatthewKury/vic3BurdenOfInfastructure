l_english:

 # ── Goods ─────────────────────────────────────────────────────────────────────
 # NOTE: this file MUST be saved as UTF-8 WITH BOM. Victoria 3 rejects plain
 # UTF-8 .yml outright - the whole file fails to load and every key in it is
 # reported as missing, which looks like dozens of unrelated errors.
 horses:0 "Horses"

 # ── Horse modifier labels ────────────────────────────────────────────────────
 goods_input_horses_add:0 "@horses! Horses input"
 goods_input_horses_add_desc:0 "The amount of @horses! Horses consumed by buildings and armies"
 goods_output_horses_add:0 "@horses! Horses output"
 goods_output_horses_add_desc:0 "The amount of @horses! Horses produced by buildings"
 goods_input_horses_mult:0 "Building @horses! Horses input"
 goods_input_horses_mult_desc:0 "The amount of @horses! Horses consumed by buildings"
 goods_output_horses_mult:0 "Building @horses! Horses output"
 goods_output_horses_mult_desc:0 "The amount of @horses! Horses produced by buildings"

 # ── Army Mobilization Options ─────────────────────────────────────────────────
 mobilization_option_boi_horseback_recon:0 "Horseback Reconnaissance"
 mobilization_option_boi_horseback_recon_desc:0 "Mounted scouts use horses to survey terrain and locate enemy positions."
 mobilization_option_boi_horse_drawn_transport:0 "Horse-Drawn Transport"
 mobilization_option_boi_horse_drawn_transport_desc:0 "Horse-drawn wagons move the army without the strain of a forced march."

 # ── State Traits ───────────────────────────────────────────────────────────────
 state_trait_boi_horse_breeding_traditions:0 "Horse-Breeding Traditions"

 # ── Buildings ─────────────────────────────────────────────────────────────────
 # Vanilla buildings and goods have no _desc loc keys - the UI builds their
 # descriptions out of the active production methods - so none are defined here.
 # The _lens_option key is the "Expand X" label in the construction lens.

 building_boi_horse_ranch:0 "Horse Ranches"
 building_boi_horse_ranch_lens_option:0 "Expand $building_boi_horse_ranch$"

 building_boi_infrastructure:0 "Public Works"
 building_boi_infrastructure_lens_option:0 "Expand $building_boi_infrastructure$"

 building_boi_harbour_works:0 "Harbour Works"
 building_boi_harbour_works_lens_option:0 "Expand $building_boi_harbour_works$"

 # ── Production Method Groups ──────────────────────────────────────────────────
 pmg_boi_horse_ranch_method:0 "Breeding Method"
 pmg_boi_infrastructure_method:0 "Haulage Method"
 pmg_boi_road_administration:0 "Road Administration"
 pmg_boi_harbour_method:0 "Harbour Method"
 pmg_boi_harbour_administration:0 "Harbour Administration"

 # ── Horse Ranch Production Methods ────────────────────────────────────────────
 pm_boi_open_pasture:0 "Open Pasture"
 pm_boi_selective_breeding:0 "Selective Breeding"
 pm_boi_stud_farms:0 "Stud Farms"

 # ── Public Works: Haulage Method ──────────────────────────────────────────────
 pm_boi_cart_roads:0 "Cart Roads"
 pm_boi_macadam_roads:0 "Macadam Roads"
 pm_boi_rail_network:0 "Rail Network"
 pm_boi_motor_roads:0 "Motor Roads"
 pm_boi_modern_highways:0 "Modern Highways"

 # ── Public Works: Road Administration ─────────────────────────────────────────
 pm_boi_appointed_surveyors:0 "County Surveyors"
 pm_boi_manorial_roadwardens:0 "Manorial Road Wardens"
