l_english:

 # ── Housing events (2026-11-08) ───────────────────────────────────────────────
 # events/boi_housing_events.txt. Must be saved as UTF-8 with BOM.
 boi_pledge_start_state_tt: "Starts a #b Rehousing Pledge#!: build #b [SCOPE.sState('hev_state').MakeScope.ScriptValue('boi_pledge_target_state')|0]#! levels of good working-class housing in [SCOPE.sState('hev_state').GetName] within two years (half a level for every level of slums and rows there). If we fail, the poor there radicalize heavily."

 boi_hev_ig_pleased: "Pleased by Housing Policy"
 boi_hev_ig_angered: "Angered by Housing Policy"
 boi_hev_camp_disaster: "Camp Disaster"
 boi_hev_camp_disaster_desc: "The company camp is still unsafe, and men keep dying in it."
 boi_hev_model_village: "Model Village"
 boi_hev_model_village_desc: "A model company village draws families to the state."
 boi_hev_model_village_prestige: "A Model Village"
 boi_hev_model_village_prestige_desc: "Reformers abroad come to see how our workers live."
 boi_hev_great_fire: "After the Great Fire"
 boi_hev_great_fire_desc: "The burned districts are full of the homeless and the injured."
 boi_hev_building_crash: "Building Societies Failed"
 boi_hev_building_crash_desc: "The building societies have failed, and private builders are cautious."
 boi_hev_red_vienna: "Red Vienna"
 boi_hev_red_vienna_desc: "Our council estates are the wonder of the workers' movement."

 # Employer housing
 boi_housing_events.10.t: "The Company Store"
 boi_housing_events.10.d: "In the work camps of [SCOPE.sState('hev_state').GetName], the men are paid in company scrip, good only at the company store, where prices are whatever the company likes. The reformers call it slavery by another name."
 boi_housing_events.10.f: "\"I owe my soul to the company store.\""
 boi_housing_events.10.a: "Ban truck wages"
 boi_housing_events.10.b: "It is a private matter between master and man"
 boi_housing_events.11.t: "Tied Cottage Evictions"
 boi_housing_events.11.d: "On the estates of [SCOPE.sState('hev_state').GetName], a labourer's cottage goes with his job. Lose the one, and he loses the other, and his family is on the road by Michaelmas."
 boi_housing_events.11.f: "The cottage was his for as long as he was useful."
 boi_housing_events.11.a: "Protect the tenant's tenure"
 boi_housing_events.11.b: "The cottage goes with the job"
 boi_housing_events.12.t: "Disaster at the Camp"
 boi_housing_events.12.d: "Fire has swept through the company camp at a works in [SCOPE.sState('hev_state').GetName]. The huts were packed close, and the men were asleep. The papers want to know who built them so."
 boi_housing_events.12.f: "Forty men in a hut built for ten."
 boi_housing_events.12.a: "Hold a public inquiry"
 boi_housing_events.12.b: "Carelessness among the men"
 boi_housing_events.13.t: "A Model Village"
 boi_housing_events.13.d: "An industrialist has built a model village for his workers in [SCOPE.sState('hev_state').GetName]: sound houses, a library, a school and baths, but no public house. Visitors come from abroad to see it."
 boi_housing_events.13.f: "Saltaire, Bournville, Port Sunlight: the paternal factory town."
 boi_housing_events.13.a: "Honour the founder"
 boi_housing_events.13.b: "Tax the village like any other"
 boi_housing_events.14.t: "The Company Town Strikes"
 boi_housing_events.14.d: "Wages in the company towns of [SCOPE.sState('hev_state').GetName] have been cut, but the company's rents have not. The men have walked out, and the unions are with them."
 boi_housing_events.14.f: "The company cut the wages and kept the rents, as at Pullman."
 boi_housing_events.14.a: "Send in the troops"
 boi_housing_events.14.b: "Arbitrate"

 # Residential housing
 boi_housing_events.20.t: "A Tenement Collapses"
 boi_housing_events.20.d: "A jerry-built tenement in [SCOPE.sState('hev_state').GetName] has fallen in on its tenants. It was built cheap and fast, without foundations worth the name, and there are no rules to say otherwise."
 boi_housing_events.20.f: "Built in a month, fallen in a minute."
 boi_housing_events.20.a: "Draft building by-laws"
 boi_housing_events.20.b: "Blame the builder"
 boi_housing_events.21.t: "The Rent Strike"
 boi_housing_events.21.d: "The tenants of [SCOPE.sState('hev_state').GetName]'s industrial districts refuse to pay the latest rise. The women of the closes turn the bailiffs away at the stair foot."
 boi_housing_events.21.f: "Glasgow, 1915: the rent strike that won rent control."
 boi_housing_events.21.a: "Restrict the rents"
 boi_housing_events.21.b: "Evict the strikers"
 boi_housing_events.22.t: "A Philanthropist's Offer"
 boi_housing_events.22.d: "A wealthy benefactor offers to fund model dwellings for the poor of [SCOPE.sState('hev_state').GetName], on one condition: that we see the work finished."
 boi_housing_events.22.f: "Five per cent philanthropy: decent homes at a modest return."
 boi_housing_events.22.a: "Accept, and promise to build"
 boi_housing_events.22.b: "Decline"
 boi_housing_events.23.t: "A Royal Commission on Housing"
 boi_housing_events.23.d: "The commission's report on the housing of the working classes is ready. It describes the slums of our cities in a detail that will shock the country, and it names the landlords."
 boi_housing_events.23.f: "The commissioners went into the courts, and came out changed."
 boi_housing_events.23.a: "Publish it"
 boi_housing_events.23.b: "Bury it"
 boi_housing_events.24.t: "The Great Fire"
 boi_housing_events.24.d: "A fire from a careless stove has burned through the wooden districts of [SCOPE.sState('hev_state').GetName]. The slums and rows are ash, and the flames took a neighbouring works with them. Thousands are homeless."
 boi_housing_events.24.f: "London 1666, Chicago 1871: the city that burns is the city that rebuilds."
 boi_housing_events.24.a: "Rebuild on a plan, in brick and stone"
 boi_housing_events.24.b: "Let them rebuild as they were"
 boi_housing_events.25.t: "A Suburban Building Bubble"
 boi_housing_events.25.d: "The building societies lent freely, the builders built villas for buyers who never came, and now the villas stand empty and the societies cannot pay their depositors."
 boi_housing_events.25.f: "Bricks and mortar: as safe as houses, until they weren't."
 boi_housing_events.25.a: "Bail out the building societies"
 boi_housing_events.25.b: "Let them fail"
 boi_housing_events.26.t: "Red Vienna"
 boi_housing_events.26.d: "Our council estates house hundreds of thousands, with courtyards, baths, kindergartens and laundries. Workers' delegations come from every country to see what a workers' city looks like."
 boi_housing_events.26.f: "The Karl-Marx-Hof: a kilometre of workers' homes."
 boi_housing_events.26.a: "The future, built"
