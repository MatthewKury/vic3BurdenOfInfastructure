l_english:

 # ── Public Works Financing events, phase 2 (2026-11-08) ──────────────────────
 # Must be saved as UTF-8 with BOM.
 boi_road_financing.10.t: "Rebecca and Her Daughters"
 boi_road_financing.10.d: "In [SCOPE.sState('rf_state').GetName], farmers with blackened faces and women's clothes have broken the tollgates by night. The tolls fall hardest on those who carry lime and corn to market, and the trusts answer to no one but their creditors."
 boi_road_financing.10.f: "\"And they blessed Rebekah, and said unto her... let thy seed possess the gate of those which hate them.\""
 boi_road_financing.10.a: "Lift the tolls there for now"
 boi_road_financing.10.b: "Send the dragoons and rebuild the gates"
 boi_road_financing.10.c: "Appoint a commission and consolidate the trusts"
 boi_road_financing.20.t: "Defaulters on the Road Duty"
 boi_road_financing.20.d: "Whole parishes of [SCOPE.sState('rf_state').GetName] have failed to turn out for their road days. The surveyors say the roads are going to ruin, and the squires want the defaulters fined."
 boi_road_financing.20.f: "Six days a year, with cart and team, at the surveyor's call."
 boi_road_financing.20.a: "Fine them, and distrain their carts"
 boi_road_financing.20.b: "Let them pay a money rate instead"
 boi_road_financing.31.t: "A Highway Act"
 boi_road_financing.31.d: "Statute labour is abolished. No household now owes the parish its days on the roads, and the squire no longer decides where they are spent."
 boi_road_financing.31.f: "The last road day passed without ceremony."
 boi_road_financing.31.a: "So ends the road duty"
 boi_rf_tolls_abolished: "Tollgates Down"
 boi_rf_tolls_abolished_desc: "The tolls are lifted here, and the trusts no longer keep the roads."
 boi_rf_duty_commuted: "Road Duty Commuted"
 boi_rf_duty_commuted_desc: "Households pay a money rate instead of their road days, and less work is done."
 boi_rf_ig_pleased: "Pleased by Road Policy"
 boi_rf_ig_angered: "Angered by Road Policy"

 # ── Horse events (2026-11-08) ─────────────────────────────────────────────────
 boi_horses.3.t: "The Great Epizootic"
 boi_horses.3.d: "A horse influenza has spread from the stables of Toronto across the continent. Draught horses stand coughing in their stalls, the streetcars have stopped, and freight piles up at the depots because there is nothing to haul it."
 boi_horses.3.f: "For a few weeks, the horse was missed by everyone."
 boi_horses.3.a: "Put men and oxen to the carts"
 boi_horses.3.b: "Rest the horses and wait it out"
 boi_horses.10.t: "Glanders in the Stables"
 boi_horses.10.d: "Glanders has broken out among the studs of [SCOPE.sState('horse_state').GetName]. It is incurable, it spreads through shared troughs, and it can kill the grooms who tend the sick animals."
 boi_horses.10.f: "\"There is no cure, only the knacker.\""
 boi_horses.10.a: "Cull every horse that shows it"
 boi_horses.10.b: "Quarantine the stables and hope"
 boi_horses.21.t: "Remounts for the Army"
 boi_horses.21.d: "The war is using up horses faster than the remount depots can buy them. The army wants the power to requisition draught horses from the farms."
 boi_horses.21.f: "An army marches on its horses as much as its stomach."
 boi_horses.21.a: "Requisition them from the farms"
 boi_horses.21.b: "Buy them on the market, whatever the price"
 boi_great_epizootic: "The Great Epizootic"
 boi_great_epizootic_desc: "Horse influenza: draught horses are sick, and freight stops."
 boi_glanders_cull: "Glanders Cull"
 boi_glanders_cull_desc: "Infected horses have been destroyed."
 boi_glanders_quarantine: "Glanders Quarantine"
 boi_glanders_quarantine_desc: "Glanders lingers in the quarantined stables, and spreads to the people who tend them."
 boi_remount_requisition: "Remount Requisitioning"
 boi_remount_requisition_desc: "The army has taken draught horses from the farms."
